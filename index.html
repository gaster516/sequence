// 整理所有詞 (不重複)
const allWords = [...new Set(data.join(" ").split(" "))];

function updateSuggestions(inputId, listId) {
  const val = document.getElementById(inputId).value.trim();
  const datalist = document.getElementById(listId);
  datalist.innerHTML = "";
  if (!val) return;
  allWords
    .filter(word => word.startsWith(val)) // 前綴推薦
    .forEach(word => {
      const opt = document.createElement("option");
      opt.value = word;
      datalist.appendChild(opt);
    });
}

function updateResults() {
  const input1 = document.getElementById("searchInput1").value.trim();
  const input2 = document.getElementById("searchInput2").value.trim();
  const container = document.getElementById("dropdownContainer");
  container.innerHTML = "";

  if (!input1) return;

  data.forEach(seq => {
    const words = seq.split(" ");

    words.forEach((word, index) => {
      if (word === input1) {
        const rotated = words.slice(index).concat(words.slice(0, index));
        if (input2 && rotated[1] !== input2) return;

        const select = document.createElement("select");
        select.className = "dropdown";

        rotated.forEach((w, i) => {
          const option = document.createElement("option");
          if (w === input1 && i === 0) {
            option.innerHTML = `<strong>${w}</strong>`;
          } else if (w === input2 && i === 1) {
            option.innerHTML = `<strong>${w}</strong>`;
          } else {
            option.textContent = w;
          }
          select.appendChild(option);
        });

        container.appendChild(select);
      }
    });
  });
}

// 綁定事件
document.getElementById("searchInput1").addEventListener("input", () => {
  updateSuggestions("searchInput1", "suggest1");
  updateResults();
});
document.getElementById("searchInput2").addEventListener("input", () => {
  updateSuggestions("searchInput2", "suggest2");
  updateResults();
});
